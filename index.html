<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<meta name="description" content="SILLAH'S LEGACY — Elegance, Style & Legacy">
<title>SILLAH'S LEGACY</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f7f7;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:18px 5%;
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 10px #0004;
}

.logo{
  font-size:21px;
  font-weight:bold;
  letter-spacing:1.5px;
}

.cart-btn{
  background:#d4af37;
  color:#111;
  border:0;
  padding:10px 15px;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  background:linear-gradient(135deg,#111,#292929);
  color:white;
  text-align:center;
  padding:65px 20px;
}

.hero h1{
  font-size:42px;
  margin-bottom:12px;
}

.hero p{
  color:#ddd;
  font-size:17px;
  margin-bottom:25px;
}

.shop-btn{
  display:inline-block;
  background:#d4af37;
  color:#111;
  padding:13px 25px;
  border-radius:25px;
  text-decoration:none;
  font-weight:bold;
}

.search-area{
  padding:25px 5% 10px;
  text-align:center;
}

.search-area input{
  width:100%;
  max-width:600px;
  padding:14px 18px;
  border:1px solid #ccc;
  border-radius:30px;
  font-size:16px;
}

.categories{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  padding:20px 5%;
}

.category{
  border:1px solid #111;
  background:white;
  padding:9px 18px;
  border-radius:25px;
  cursor:pointer;
}

.category.active,
.category:hover{
  background:#111;
  color:#fff;
}

.products{
  padding:20px 5% 60px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
  max-width:1200px;
  margin:auto;
}

.product{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 15px #0001;
  transition:.2s;
}

.product:hover{
  transform:translateY(-4px);
}

.product-image{
  height:220px;
  background:linear-gradient(135deg,#222,#777);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:60px;
}

.product-info{
  padding:17px;
}

.product-info h3{
  margin-bottom:8px;
}

.product-info p{
  color:#777;
  font-size:14px;
  margin-bottom:10px;
}

.price{
  color:#b18b13;
  font-weight:bold;
  font-size:18px;
  margin-bottom:14px;
}

.add-btn{
  width:100%;
  border:0;
  background:#111;
  color:#fff;
  padding:12px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.add-btn:hover{
  background:#d4af37;
  color:#111;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:40px;
  color:#777;
}

/* CART */

.cart-panel{
  position:fixed;
  right:-100%;
  top:0;
  width:min(420px,100%);
  height:100vh;
  background:white;
  z-index:2000;
  box-shadow:-5px 0 20px #0003;
  transition:.3s;
  display:flex;
  flex-direction:column;
}

.cart-panel.open{
  right:0;
}

.cart-header{
  background:#111;
  color:#fff;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close-cart{
  background:none;
  color:white;
  border:0;
  font-size:25px;
  cursor:pointer;
}

.cart-items{
  flex:1;
  overflow:auto;
  padding:18px;
}

.cart-item{
  border-bottom:1px solid #ddd;
  padding:14px 0;
}

.cart-item strong{
  display:block;
  margin-bottom:6px;
}

.cart-controls{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}

.cart-controls button{
  border:0;
  background:#111;
  color:white;
  width:28px;
  height:28px;
  border-radius:50%;
  cursor:pointer;
}

.remove{
  margin-left:auto;
  background:#eee !important;
  color:#111 !important;
  border-radius:5px !important;
  width:auto !important;
  padding:0 8px;
}

.cart-footer{
  padding:18px;
  border-top:1px solid #ddd;
}

.total{
  font-size:21px;
  font-weight:bold;
  margin-bottom:14px;
}

.whatsapp{
  width:100%;
  border:0;
  background:#25D366;
  color:white;
  padding:14px;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.clear{
  width:100%;
  margin-top:8px;
  padding:11px;
  border:1px solid #ccc;
  background:white;
  border-radius:8px;
  cursor:pointer;
}

footer{
  background:#111;
  color:#fff;
  text-align:center;
  padding:35px 20px;
}

footer p{
  margin:8px 0;
  color:#ccc;
}

.badge{
  background:#111;
  color:#fff;
  border-radius:20px;
  padding:2px 7px;
  font-size:12px;
  margin-left:4px;
}

@media(max-width:600px){
  .hero h1{
    font-size:31px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .product-image{
    height:150px;
    font-size:45px;
  }

  .product-info{
    padding:12px;
  }

  .product-info h3{
    font-size:15px;
  }

  .price{
    font-size:15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">SILLAH'S LEGACY</div>
  <button class="cart-btn" onclick="openCart()">
    🛒 Cart <span id="cartCount" class="badge">0</span>
  </button>
</header>

<section class="hero">
  <h1>SILLAH'S LEGACY</h1>
  <p>Elegance • Style • Legacy</p>
  <a href="#shop" class="shop-btn">Shop Now</a>
</section>

<div class="search-area">
  <input
    type="text"
    id="search"
    placeholder="Search perfumes, watches, T-shirts..."
    oninput="displayProducts()"
  >
</div>

<div class="categories">
  <button class="category active" onclick="filterCategory('All',this)">All</button>
  <button class="category" onclick="filterCategory('Perfumes',this)">Perfumes</button>
  <button class="category" onclick="filterCategory('Watches',this)">Watches</button>
  <button class="category" onclick="filterCategory('T-Shirts',this)">T-Shirts</button>
</div>

<section id="shop" class="products"></section>

<footer>
  <h2>SILLAH'S LEGACY</h2>
  <p>Elegance, Style & Legacy</p>
  <p>© 2026 SILLAH'S LEGACY. All rights reserved.</p>
</footer>

<!-- CART -->

<div id="cartPanel" class="cart-panel">

  <div class="cart-header">
    <h2>Your Cart</h2>
    <button class="close-cart" onclick="closeCart()">×</button>
  </div>

  <div id="cartItems" class="cart-items"></div>

  <div class="cart-footer">
    <div class="total">
      Total: <span id="cartTotal">SLE 0</span>
    </div>

    <button class="whatsapp" onclick="orderWhatsApp()">
      Order on WhatsApp
    </button>

    <button class="clear" onclick="clearCart()">
      Clear Cart
    </button>
  </div>

</div>

<script>

/* =========================
   PRODUCTS
========================= */

const products = [

  {
    id:1,
    name:"Royal Oud Perfume",
    category:"Perfumes",
    price:350,
    icon:"🌹"
  },

  {
    id:2,
    name:"Luxury Gold Perfume",
    category:"Perfumes",
    price:450,
    icon:"🧴"
  },

  {
    id:3,
    name:"Classic Black Perfume",
    category:"Perfumes",
    price:300,
    icon:"✨"
  },

  {
    id:4,
    name:"Royal Gold Watch",
    category:"Watches",
    price:1200,
    icon:"⌚"
  },

  {
    id:5,
    name:"Classic Black Watch",
    category:"Watches",
    price:950,
    icon:"⌚"
  },

  {
    id:6,
    name:"Luxury Silver Watch",
    category:"Watches",
    price:1100,
    icon:"⌚"
  },

  {
    id:7,
    name:"SILLAH'S LEGACY T-Shirt",
    category:"T-Shirts",
    price:300,
    icon:"👕"
  },

  {
    id:8,
    name:"Classic Black T-Shirt",
    category:"T-Shirts",
    price:250,
    icon:"👕"
  },

  {
    id:9,
    name:"Premium White T-Shirt",
    category:"T-Shirts",
    price:280,
    icon:"👕"
  }

];

/* =========================
   SETTINGS
========================= */

/*
   IMPORTANT:
   Replace this number with your
   WhatsApp number.

   Sierra Leone country code = 232

   Example:
   23276XXXXXX
*/

const whatsappNumber = "23273520329";


let cart = [];
let selectedCategory = "All";


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts(){

  const container = document.getElementById("shop");

  const search =
    document.getElementById("search").value.toLowerCase();

  const filtered = products.filter(product => {

    const matchesCategory =
      selectedCategory === "All" ||
      product.category === selectedCategory;

    const matchesSearch =
      product.name.toLowerCase().includes(search);

    return matchesCategory && matchesSearch;

  });

  if(filtered.length === 0){

    container.innerHTML =
      `<div class="empty">No products found.</div>`;

    return;

  }

  container.innerHTML = filtered.map(product => `

    <div class="product">

      <div class="product-image">
        ${product.icon}
      </div>

      <div class="product-info">

        <h3>${product.name}</h3>

        <p>${product.category}</p>

        <div class="price">
          SLE ${product.price.toLocaleString()}
        </div>

        <button
          class="add-btn"
          onclick="addToCart(${product.id})"
        >
          Add to Cart
        </button>

      </div>

    </div>

  `).join("");

}


/* =========================
   CATEGORY FILTER
========================= */

function filterCategory(category,button){

  selectedCategory = category;

  document
    .querySelectorAll(".category")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  displayProducts();

}


/* =========================
   ADD TO CART
========================= */

function addToCart(id){

  const product = products.find(p => p.id === id);

  const existing = cart.find(item => item.id === id);

  if(existing){

    existing.quantity++;

  }else{

    cart.push({
      ...product,
      quantity:1
    });

  }

  updateCart();

}


/* =========================
   UPDATE CART
========================= */

function updateCart(){

  const cartItems =
    document.getElementById("cartItems");

  const cartCount =
    document.getElementById("cartCount");

  const cartTotal =
    document.getElementById("cartTotal");


  let totalQuantity = 0;
  let totalPrice = 0;


  cart.forEach(item => {

    totalQuantity += item.quantity;

    totalPrice +=
      item.price * item.quantity;

  });


  cartCount.textContent = totalQuantity;

  cartTotal.textContent =
    "SLE " + totalPrice.toLocaleString();


  if(cart.length === 0){

    cartItems.innerHTML =
      `<div class="empty">Your cart is empty.</div>`;

    return;

  }


  cartItems.innerHTML = cart.map(item => `

    <div class="cart-item">

      <strong>${item.name}</strong>

      <div>
        SLE ${item.price.toLocaleString()}
      </div>

      <div class="cart-controls">

        <button onclick="changeQuantity(${item.id},-1)">
          −
        </button>

        <span>${item.quantity}</span>

        <button onclick="changeQuantity(${item.id},1)">
          +
        </button>

        <button
          class="remove"
          onclick="removeFromCart(${item.id})"
        >
          Remove
        </button>

      </div>

    </div>

  `).join("");

}


/* =========================
   CHANGE QUANTITY
========================= */

function changeQuantity(id,change){

  const item =
    cart.find(product => product.id === id);

  if(!item) return;

  item.quantity += change;

  if(item.quantity <= 0){

    cart =
      cart.filter(product => product.id !== id);

  }

  updateCart();

}


/* =========================
   REMOVE
========================= */

function removeFromCart(id){

  cart =
    cart.filter(item => item.id !== id);

  updateCart();

}


/* =========================
   CLEAR CART
========================= */

function clearCart(){

  cart = [];

  updateCart();

}


/* =========================
   OPEN / CLOSE CART
========================= */

function openCart(){

  document
    .getElementById("cartPanel")
    .classList.add("open");

}


function closeCart(){

  document
    .getElementById("cartPanel")
    .classList.remove("open");

}


/* =========================
   WHATSAPP ORDER
========================= */

function orderWhatsApp(){

  if(cart.length === 0){

    alert("Your cart is empty.");

    return;

  }


  let message =
    "Hello SILLAH'S LEGACY!%0A%0A" +
    "I would like to place an order:%0A%0A";


  let total = 0;


  cart.forEach(item => {

    const subtotal =
      item.price * item.quantity;

    total += subtotal;


    message +=
      "• " +
      item.name +
      " × " +
      item.quantity +
      " — SLE " +
      subtotal.toLocaleString() +
      "%0A";

  });


  message +=
    "%0A*Total: SLE " +
    total.toLocaleString() +
    "*%0A%0A" +
    "Please confirm my order. Thank you!";


  window.open(
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    message,
    "_blank"
  );

}


/* =========================
   START
========================= */

displayProducts();

updateCart();

</script>

</body>
</html>
